[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kronos-risk-intelligence"
version = "1.2.0"
description = "Synthetic enterprise credit-risk analytics and governance portfolio"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["src*"]
